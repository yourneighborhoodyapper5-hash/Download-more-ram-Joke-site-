<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>More RAM Downloader</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #100d18;
      color: #f5f1ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 10%, #39235b 0, transparent 35%),
        radial-gradient(circle at 90% 90%, #291642 0, transparent 35%),
        #100d18;
    }

    main {
      width: min(100%, 480px);
      padding: 32px;
      border: 1px solid #493566;
      border-radius: 22px;
      background: #191423;
      box-shadow: 0 24px 80px #0008;
    }

    .icon {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      border-radius: 16px;
      background: #34204f;
      font-size: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 7vw, 2.4rem);
      letter-spacing: -0.04em;
    }

    .intro, .disclaimer {
      color: #bdb2ce;
      line-height: 1.5;
    }

    form {
      margin-top: 28px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-weight: 650;
    }

    .amount-row {
      display: flex;
      gap: 10px;
    }

    input, select, button {
      min-height: 48px;
      border: 1px solid #55436d;
      border-radius: 11px;
      color: #f5f1ff;
      font: inherit;
    }

    input, select {
      background: #100d18;
      padding: 0 13px;
    }

    input {
      min-width: 0;
      flex: 1;
    }

    select {
      width: 105px;
    }

    button {
      width: 100%;
      margin-top: 14px;
      border: 0;
      background: #a879ff;
      color: #170e22;
      font-weight: 750;
      cursor: pointer;
      transition: filter 150ms ease, transform 150ms ease;
    }

    button:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .download-area {
      margin-top: 26px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      color: #d9c9f3;
      font-size: 0.95rem;
    }

    progress {
      display: block;
      width: 100%;
      height: 14px;
      overflow: hidden;
      border: 0;
      border-radius: 999px;
      background: #30263d;
      accent-color: #b184ff;
    }

    progress::-webkit-progress-bar {
      border-radius: 999px;
      background: #30263d;
    }

    progress::-webkit-progress-value {
      border-radius: 999px;
      background: linear-gradient(90deg, #8b5cf6, #d0a6ff);
      transition: width 120ms linear;
    }

    progress::-moz-progress-bar {
      border-radius: 999px;
      background: linear-gradient(90deg, #8b5cf6, #d0a6ff);
    }

    .result {
      min-height: 28px;
      margin: 18px 0 0;
      color: #d8c2ff;
      font-weight: 700;
      line-height: 1.45;
    }

    .disclaimer {
      margin: 24px 0 0;
      font-size: 0.82rem;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🧠</div>
    <h1>More RAM Downloader</h1>
    <p class="intro">Running low on memory? Download some more. It’s definitely that easy.</p>

    <form id="download-form">
      <label for="amount">How much RAM do you want?</label>
      <div class="amount-row">
        <input
          id="amount"
          name="amount"
          type="number"
          min="1"
          max="1024"
          step="any"
          value="16"
          required
        >
        <select id="unit" name="unit" aria-label="RAM unit">
          <option value="GB">GB</option>
          <option value="TB">TB</option>
        </select>
      </div>
      <button id="download-button" type="submit">Download RAM</button>
    </form>

    <section class="download-area" aria-live="polite">
      <div class="status-row">
        <span id="status">Ready when you are.</span>
        <span id="percent">0%</span>
      </div>
      <progress id="progress" value="0" max="100" aria-label="Download progress"></progress>
      <p id="result" class="result"></p>
    </section>

    <p class="disclaimer">
      Totally fake, obviously. A website can’t download physical RAM into your computer.
    </p>
  </main>

  <script>
    const form = document.querySelector("#download-form");
    const amountInput = document.querySelector("#amount");
    const unitSelect = document.querySelector("#unit");
    const button = document.querySelector("#download-button");
    const progressBar = document.querySelector("#progress");
    const percentLabel = document.querySelector("#percent");
    const statusLabel = document.querySelector("#status");
    const result = document.querySelector("#result");

    const messages = [
      { at: 0, text: "Connecting to the RAM cloud..." },
      { at: 20, text: "Finding available memory..." },
      { at: 45, text: "Downloading extra RAM..." },
      { at: 70, text: "Installing imaginary memory chips..." },
      { at: 92, text: "Finalizing your upgrade..." }
    ];

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!form.reportValidity()) return;

      const amount = Number(amountInput.value);
      const unit = unitSelect.value;
      const formattedAmount = Number.isInteger(amount)
        ? amount
        : amount.toFixed(1);

      amountInput.disabled = true;
      unitSelect.disabled = true;
      button.disabled = true;
      button.textContent = "Downloading...";
      result.textContent = "";

      progressBar.value = 0;
      percentLabel.textContent = "0%";
      statusLabel.textContent = messages[0].text;

      const duration = 6500;
      const startedAt = performance.now();

      function updateDownload(now) {
        const elapsed = now - startedAt;
        const progress = Math.min((elapsed / duration) * 100, 100);

        progressBar.value = progress;
        percentLabel.textContent = `${Math.floor(progress)}%`;

        const currentMessage = [...messages]
          .reverse()
          .find((message) => progress >= message.at);

        statusLabel.textContent = currentMessage.text;

        if (progress < 100) {
          requestAnimationFrame(updateDownload);
          return;
        }

        statusLabel.textContent = "Download complete!";
        result.textContent = `Success! You now have ${formattedAmount} ${unit} more RAM.`;
        button.disabled = false;
        button.textContent = "Download More RAM";
        amountInput.disabled = false;
        unitSelect.disabled = false;
      }

      requestAnimationFrame(updateDownload);
    });
  </script>
</body>
</html>
```
